server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: ads-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/ads/**
          filters:
            - RewritePath=/api/ads/(?<segment>.*), /$\{segment}
        - id: auth-service
          uri: http://auth-service:8083
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /$\{segment}
        - id: task-service
          uri: http://task-service:8084
          predicates:
            - Path=/api/tasks/**
          filters:
            - RewritePath=/api/tasks/(?<segment>.*), /$\{segment}
        - id: repo-service
          uri: http://repo-service:8085
          predicates:
            - Path=/api/repos/**
          filters:
            - RewritePath=/api/repos/(?<segment>.*), /$\{segment}
        - id: docs-service
          uri: http://docs-service:8086
          predicates:
            - Path=/api/docs/**
          filters:
            - RewritePath=/api/docs/(?<segment>.*), /$\{segment}
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/notifications/(?<segment>.*), /$\{segment}
        - id: automation-service
          uri: http://automation-service:8088
          predicates:
            - Path=/api/automation/**
          filters:
            - RewritePath=/api/automation/(?<segment>.*), /$\{segment}
        - id: analytics-service
          uri: http://analytics-service:8082
          predicates:
            - Path=/api/analytics/**
          filters:
            - RewritePath=/api/analytics/(?<segment>.*), /$\{segment}

