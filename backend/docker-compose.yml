  # ============================================
  # API Gateway (Entry Point)
  # ============================================
  api-gateway:
    build:
      context: ../
      dockerfile: backend/api-gateway/Dockerfile
    container_name: jiraffle-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - ads-service
      - analytics-service
      - task-service
      - repo-service
      - docs-service
      - notification-service
      - automation-service
    networks:
      - jiraffle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================
  # Core Services
  # ============================================
  auth-service:
    build:
      context: ../
      dockerfile: backend/auth-service/Dockerfile
    container_name: jiraffle-auth-service
    # environment:
