    #   JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
    #   JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    #   REDIS_HOST: redis
    #   REDIS_PORT: 6379
    ports:
      - "8083:8083"
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    networks:
      - jiraffle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ads-service:
    build:
      context: ../
      dockerfile: backend/ads-service/Dockerfile
    container_name: jiraffle-ads-service
    # environment:
      # SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
